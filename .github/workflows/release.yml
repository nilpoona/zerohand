name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # packages: write  # Uncomment if you enable Docker image publishing

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Uncomment if you enable Docker
          # DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}  # Uncomment if you enable Docker
